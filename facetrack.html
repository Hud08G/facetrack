<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>FaceTrack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;gap:1.5rem}
h1{font-size:22px;font-weight:600}
.status{font-size:13px;color:#888;text-align:center;line-height:1.6;min-height:40px}
.status.connected{color:#4caf50}
.status.error{color:#f44336}
button{width:100%;padding:14px;border-radius:10px;border:none;background:#B71C1C;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.data{background:#1a1a1a;border-radius:10px;padding:1rem;width:100%;font-family:monospace;font-size:14px;color:#4caf50;line-height:2.2}
.data span{color:#555}
</style>
</head>
<body>
<h1>✈ FaceTrack</h1>
<div class="status" id="status">Tap Start to begin</div>
<button id="btn" onclick="toggle()">Start Tracking</button>
<div class="data">
  <div><span>Yaw&nbsp;&nbsp;&nbsp; </span><span id="dy">—</span></div>
  <div><span>Pitch&nbsp; </span><span id="dp">—</span></div>
  <div><span>Roll&nbsp;&nbsp; </span><span id="dr">—</span></div>
</div>

<script>
const WS_URL = 'wss://desktop-57cgmcq.tail7f7f7e.ts.net';
let ws = null;
let running = false;
let interval = null;
let alpha = 0, beta = 0, gamma = 0;
let sA = 0, sB = 0, sG = 0;
const S = 0.25;

function onOrientation(e) {
  alpha = e.alpha || 0;
  beta  = e.beta  || 0;
  gamma = e.gamma || 0;
  sA = sA * S + alpha * (1-S);
  sB = sB * S + beta  * (1-S);
  sG = sG * S + gamma * (1-S);
  document.getElementById('dy').textContent = sA.toFixed(1) + '°';
  document.getElementById('dp').textContent = sB.toFixed(1) + '°';
  document.getElementById('dr').textContent = sG.toFixed(1) + '°';
}

async function toggle() {
  if (running) { stop(); return; }

  // iOS 13+ needs permission
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceOrientationEvent.requestPermission();
      if (perm !== 'granted') {
        setStatus('Motion access denied.', 'error');
        return;
      }
    } catch(e) {
      setStatus('Permission error: ' + e, 'error');
      return;
    }
  }

  window.addEventListener('deviceorientation', onOrientation);
  setStatus('Connecting to bridge...', '');

  ws = new WebSocket(WS_URL, [], {
    headers: { 'ngrok-skip-browser-warning': 'true' }
  });

  ws.onopen = () => {
    running = true;
    setStatus('Connected ✓ Tracking active', 'connected');
    document.getElementById('btn').textContent = 'Stop Tracking';
    document.getElementById('btn').style.background = '#333';
    interval = setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(sA.toFixed(2) + ',' + sB.toFixed(2) + ',' + sG.toFixed(2));
      }
    }, 100);
  };

  ws.onerror = (e) => {
    setStatus('Connection failed. Is bridge running?', 'error');
    stop();
  };

  ws.onclose = () => {
    if (running) { setStatus('Disconnected.', 'error'); stop(); }
  };
}

function stop() {
  running = false;
  if (interval) { clearInterval(interval); interval = null; }
  if (ws) { ws.close(); ws = null; }
  window.removeEventListener('deviceorientation', onOrientation);
  document.getElementById('btn').textContent = 'Start Tracking';
  document.getElementById('btn').style.background = '#B71C1C';
  setStatus('Stopped.', '');
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + cls;
}
</script>
</body>
</html>
